  :root{
    --paper:#f6f4ef;--panel:#ffffff;--ink:#1c1b18;--ink-soft:#57544b;--ink-faint:#8a8677;
    --rule:#d8d4c8;--redact:#141414;--protected:#1f3d2f;--protected-soft:#e3ebe4;
    --warn:#8a4a1f;--warn-bg:#f3e4d4;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px;}
  nav{padding:10px 0;border-bottom:1px solid var(--rule);}
  nav .navwrap{max-width:1120px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;}
  .navlinks{display:flex;gap:18px;font-size:13px;font-weight:500;color:var(--ink-soft);white-space:nowrap;}
  .navlinks a:hover{color:var(--ink);}
  .nav-cta{background:var(--redact);color:var(--paper);padding:11px 20px;border-radius:2px;font-weight:600;font-size:13.5px;white-space:nowrap;flex-shrink:0;}

  .head{padding:16px 0 0;text-align:center;}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--protected);margin-bottom:6px;}
  h1{font-family:'Source Serif 4',serif;font-weight:700;font-size:clamp(24px,3vw,30px);line-height:1.15;margin:0 auto;max-width:none;}
  .head p{color:var(--ink-soft);font-size:15.5px;max-width:56ch;margin:0 auto;}

  .cal{max-width:820px;margin:14px auto 0;background:var(--panel);border:1px solid var(--rule);border-radius:4px;overflow:hidden;}
  .cal iframe{display:block;width:100%;height:calc(100vh - 170px);min-height:440px;border:0;}

  footer{padding:40px 0;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--rule);text-align:center;margin-top:40px;}

  @media(max-width:640px){
    .wrap,.navwrap{padding-left:20px;padding-right:20px;}
    nav{padding:10px 0;}
    nav .navwrap{justify-content:flex-start;}
    nav img{width:min(100%,320px);height:auto !important;}
    .navlinks,.nav-cta{display:none;}
    .head{padding:12px 0 0;}
    .cal{margin-top:10px;border-radius:0;border-left:0;border-right:0;}
    .cal iframe{height:calc(100svh - 168px);}
    footer{margin-top:28px;}
  }
